services:
  - type: web
    name: job-finder-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: "bash render-build.sh"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: 1
      - key: PYTHONUNBUFFERED
        value: 1

  - type: web
    name: job-finder-frontend
    runtime: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run preview -- --host 0.0.0.0 --port 5173"
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_ENV
        value: production
