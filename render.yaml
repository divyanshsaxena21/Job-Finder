services:
  - type: web
    name: job-finder-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: "bash render-build.sh"
    startCommand: "cd backend && gunicorn -w 1 -k uvicorn.workers.UvicornWorker --timeout 120 app.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: 1
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PYTHONDONTWRITEBYTECODE
        value: 1
